[package]
name = "sshutil"
version = "1.2.0"
description = "ResiliSSH — macOS SFTP upload/download with weak-network resume"
authors = ["cabbage"]
edition = "2021"
# 包里有两个可执行文件（图形界面与命令行 resiliss），`cargo run` / tauri 默认运行图形界面。
default-run = "sshutil"

[lib]
name = "sshutil_lib"
# 只做 macOS 桌面端：cdylib / staticlib 是移动端才需要的产物，开着只会让每次（尤其是 LTO 的 release）构建多链接两遍。
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
log = "0.4"
dirs = "6"
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-log = "2"
# 查询本地磁盘剩余空间（statvfs）。已是 ssh2 的间接依赖，显式声明不引入新代码。
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
